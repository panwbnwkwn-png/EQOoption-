<html lang="ar" dir="rtl">

<meta name="viewport" content="width=device-width, initial-scale=1">

*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111216;color:#f5f6fa;font-family:Arial,Tahoma,sans-serif;display:flex;justify-content:center;align-items:center;padding:24px 14px}
.container{width:100%;max-width:560px}.topbar{display:flex;justify-content:flex-end;margin-bottom:12px}
.lang{border:1px solid #596174;background:#20232d;color:white;border-radius:9px;padding:9px 14px;cursor:pointer}
.logo{text-align:center;font-size:34px;font-weight:900;margin:0 0 22px}.logo span{color:#2678ff}
.notice{background:#101a2b;border:1px solid #0755a9;border-radius:14px;padding:18px;margin-bottom:22px;line-height:1.8}
.notice strong{color:#3284ff;font-size:19px}.notice p{margin:5px 0 0;color:#c5ccda}
.card{background:#424b60;border-radius:18px;padding:26px 24px;box-shadow:0 12px 35px #0005}
.tabs{display:flex;background:#596174;border-radius:12px;padding:7px;margin-bottom:24px}
.tabs button{width:50%;border:0;background:transparent;color:#b8c2d2;padding:16px 8px;font-size:19px;font-weight:bold;border-radius:9px;cursor:pointer}
.tabs button.active{background:#30394e;color:#fff;border-bottom:4px solid #0875ff}
.form{display:none}.form.active{display:block}.field{margin:19px 0}
.field label{display:block;color:#e0e6f0;font-size:16px;font-weight:bold;margin-bottom:9px}
.field input,.field select{width:100%;min-height:54px;border:2px solid #343a49;border-radius:13px;background:#20232d;color:#fff;padding:13px;font-size:16px;outline:none}
.field input:focus,.field select:focus{border-color:#2678ff}
.country-wrap{display:grid;grid-template-columns:1fr;gap:8px}
.iti{width:100%;direction:ltr}.iti input{width:100%!important;min-height:56px!important;background:#20232d!important;color:#fff!important;border:2px solid #343a49!important;border-radius:13px!important;padding-left:95px!important;font-size:17px!important}
.iti__country-list{background:#20232d!important;color:#fff!important;border:1px solid #596174!important;max-height:260px!important;direction:ltr;z-index:9999}
.iti__country{padding:9px 12px!important}.iti__country:hover,.iti__country.iti__highlight{background:#34435d!important}.iti__dial-code{color:#83b5ff!important}
.check-row{display:flex;align-items:flex-start;gap:12px;margin:20px 0;line-height:1.7;font-size:14px}.check-row input{width:22px;height:22px;flex-shrink:0;margin-top:3px;accent-color:#0875ff}
.submit{width:100%;border:0;border-radius:14px;background:linear-gradient(100deg,#287bff,#0062f5);color:white;font-size:20px;font-weight:bold;padding:17px;margin-top:12px;cursor:pointer}
.submit:disabled{opacity:.6;cursor:wait}.message{display:none;padding:13px;border-radius:10px;margin:15px 0;line-height:1.7;background:#172b42;color:#dceaff;overflow-wrap:anywhere}
.message.show{display:block}.message.error{background:#48252b;color:#ffe1e1}
.text-link{display:inline-block;color:#9dc5ff;background:none;border:0;padding:8px 0;cursor:pointer;text-decoration:underline;font-size:14px}
.footer{text-align:center;color:#9da9bd;font-size:13px;margin-top:22px}
[dir="ltr"] .field label,[dir="ltr"] .notice,[dir="ltr"] .footer{text-align:left}
@media(max-width:420px){.card{padding:22px 16px}.tabs button{font-size:17px}.logo{font-size:28px}}
</style>
</head>

<div class="container">
 <div class="topbar"><button class="lang" id="languageButton" type="button">English</button></div>
 <div class="logo">EQO<span>Option</span></div>
 <div class="notice"><strong data-i18n="secure">دخول آمن · EQOOption</strong><p data-i18n="intro">أنشئ حسابك أو سجّل الدخول للوصول إلى منصتك.</p></div>
 <main class="card">
  <div class="tabs">
   <button type="button" id="registerTab" class="active" data-i18n="register">التسجيل</button>
   <button type="button" id="loginTab" data-i18n="login">تسجيل الدخول</button>
  </div>
  <div id="message" class="message" role="status" aria-live="polite"></div>
  <form id="registerForm" class="form active">
   <div class="field"><label for="residenceCountry" data-i18n="residence">بلد الإقامة</label>
    <select id="residenceCountry" required><option value="">جارٍ تجهيز قائمة الدول...</option></select>
   </div>
   <div class="field"><label for="regPhone" data-i18n="phone">رقم الهاتف</label><input id="regPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="أدخل رقم الهاتف" required></div>
   <div class="field"><label for="regName" data-i18n="fullName">الاسم الكامل</label><input id="regName" type="text" autocomplete="name" placeholder="الاسم الأول واسم العائلة" required></div>
   <div class="field"><label for="regEmail" data-i18n="email">البريد الإلكتروني</label><input id="regEmail" type="email" autocomplete="email" placeholder="أدخل بريدك الإلكتروني" required></div>
   <div class="field"><label for="regReferral" data-i18n="referral">رمز الإحالة (اختياري)</label><input id="regReferral" type="text" placeholder="أدخل رمز الإحالة"></div>
   <div class="field"><label for="regPassword" data-i18n="password">كلمة المرور</label><input id="regPassword" type="password" minlength="8" autocomplete="new-password" placeholder="8 أحرف على الأقل" required></div>
   <div class="check-row"><input id="ageAgree" type="checkbox" required><label for="ageAgree" data-i18n="ageAgree">أؤكد أن عمري 18 عاماً أو أكثر وأوافق على شروط المنصة.</label></div>
   <button class="submit" id="registerButton" type="submit" data-i18n="createAccount">إنشاء الحساب</button>
  </form>
  <form id="loginForm" class="form">
   <div class="field"><label for="loginEmail" data-i18n="email">البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email" placeholder="أدخل بريدك الإلكتروني" required></div>
   <div class="field"><label for="loginPassword" data-i18n="password">كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="كلمة المرور" required></div>
   <button class="text-link" type="button" id="forgotButton" data-i18n="forgot">نسيت كلمة المرور؟</button>
   <button class="submit" id="loginButton" type="submit" data-i18n="login">تسجيل الدخول</button>
  </form>
 </main>
 <div class="footer">EQOOption · <span data-i18n="footer">منصة الحسابات</span></div>
</div>

 const selected=residenceCountry.value||"ye";
 residenceCountry.innerHTML="";
 const first=document.createElement("option");first.value="";first.textContent=t("chooseCountry");residenceCountry.appendChild(first);
 ALL_COUNTRIES.forEach(c=>{const o=document.createElement("option");o.value=c.code;o.textContent=countryLabel(c);residenceCountry.appendChild(o)});
 residenceCountry.value=ALL_COUNTRIES.some(c=>c.code===selected)?selected:"ye";
}
residenceCountry.addEventListener("change",()=>{if(phoneSelector&&residenceCountry.value)phoneSelector.setCountry(residenceCountry.value)});
try{
 if(window.supabase?.createClient)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}catch(e){console.error(e)}
populateCountries();
try{
 if(typeof window.intlTelInput==="function"){
  phoneSelector=window.intlTelInput(phoneInput,{initialCountry:"ye",separateDialCode:true,nationalMode:true,allowDropdown:true,countrySearch:true,preferredCountries:["ye","sa","ae","eg"],useFullscreenPopup:true,loadUtils:()=>import("https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/js/utils.js")});
 }else{console.warn("intl-tel-input unavailable; country list remains usable.")}
}catch(e){console.error("Phone setup:",e)}
$("registerForm").addEventListener("submit",async e=>{
 e.preventDefault();clearMessage();
 if(!supabaseClient){showMessage(t("authUnavailable"),true);return}
 const countryIso=residenceCountry.value,name=$("regName").value.trim(),email=$("regEmail").value.trim(),password=$("regPassword").value,referral=$("regReferral").value.trim();
 if(!countryIso){showMessage(t("selectCountry"),true);return}
 if(!name){showMessage(t("nameRequired"),true);return}
 if(password.length<8){showMessage(t("passwordShort"),true);return}
 if(!$("ageAgree").checked){showMessage(t("ageRequired"),true);return}
 let fullPhone="",dialCode="";
 if(phoneSelector){
  // Convert Arabic/Persian numerals to Western digits before validation.
  phoneInput.value=phoneInput.value.replace(/[٠-٩۰-۹]/g,ch=>String("٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹".indexOf(ch)%10));
  try{if(phoneSelector.promise)await phoneSelector.promise;}catch(phoneLoadError){console.error("Phone utilities failed to load:",phoneLoadError);showMessage(t("phoneUnavailable"),true);return}
  if(!phoneInput.value.trim()||!phoneSelector.isValidNumber()){
   showMessage(t("phoneInvalid"),true);phoneInput.focus();return;
  }
  fullPhone=phoneSelector.getNumber();
  dialCode=phoneSelector.getSelectedCountryData().dialCode||"";
  if(!fullPhone||!/^\+[1-9]\d{6,14}$/.test(fullPhone)){
   showMessage(t("phoneInvalid"),true);phoneInput.focus();return;
  }
 }else{showMessage(t("phoneUnavailable"),true);return}
 const button=$("registerButton");button.disabled=true;button.textContent=t("registering");
 try{
  const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name,phone:fullPhone,residence_country_code:countryIso.toUpperCase(),residence_country_name:countryLabel(ALL_COUNTRIES.find(c=>c.code===countryIso)),phone_country_code:dialCode,referral_code:referral||null}}});
  if(error)throw error;
  if(data.session){showMessage(t("created"));window.location.href="trading.html"}
  else{showForm("login");$("loginEmail").value=email;showMessage(t("confirmEmail"))}
 }catch(err){console.error(err);showMessage(t("error")+err.message,true)}
 finally{button.disabled=false;button.textContent=t("createAccount")}
});
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();clearMessage();
 if(!supabaseClient){showMessage(t("authUnavailable"),true);return}
 const email=$("loginEmail").value.trim(),password=$("loginPassword").value,button=$("loginButton");
 button.disabled=true;button.textContent=t("loginNow");
 try{
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)throw error;if(!data.session)throw new Error("No session returned");
  showMessage(t("loggedIn"));window.location.href="trading.html";
 }catch(err){console.error(err);showMessage(t("error")+err.message,true)}
 finally{button.disabled=false;button.textContent=t("login")}
});
$("forgotButton").addEventListener("click",async()=>{
 clearMessage();if(!supabaseClient){showMessage(t("authUnavailable"),true);return}
 const email=$("loginEmail").value.trim();
 if(!email){showMessage(t("resetPrompt"),true);$("loginEmail").focus();return}
 try{
  const redirectTo=window.location.origin+window.location.pathname;
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
  if(error)throw error;showMessage(t("resetSent"));
 }catch(err){console.error(err);showMessage(t("resetError")+err.message,true)}
});
setLanguage("ar");
</script>
</body>
</html>
