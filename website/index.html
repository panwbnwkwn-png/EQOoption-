<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101522">
<title>EQOoption | منصة التداول</title>

<!-- تحميل مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #101522;
  color: white;
  min-height: 100vh;
}

header {
  height: 85px;
  padding: 10px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #293244;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 26px;
  font-weight: bold;
  color: #20d6a0;
}

.logo img {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  object-fit: contain;
}

.logo span {
  color: white;
}

.lang {
  background: #202b3d;
  color: white;
  border: 1px solid #39465b;
  padding: 11px 16px;
  border-radius: 8px;
  cursor: pointer;
}

main {
  min-height: calc(100vh - 145px);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 15px;
}

.card {
  width: 100%;
  max-width: 440px;
  background: #1a2435;
  border: 1px solid #303d52;
  border-radius: 17px;
  padding: 30px;
  box-shadow: 0 15px 50px #0005;
}

h1 {
  text-align: center;
  margin-bottom: 12px;
}

.subtitle {
  text-align: center;
  color: #9eacc0;
  line-height: 1.8;
  font-size: 14px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 25px 0;
}

.tab {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #263247;
  color: white;
  cursor: pointer;
}

.tab.active {
  background: #19b987;
  color: #071a18;
  font-weight: bold;
}

label {
  display: block;
  margin: 16px 0 8px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  background: #101927;
  border: 1px solid #3b4960;
  border-radius: 8px;
  color: white;
  font-size: 15px;
}

.password {
  display: flex;
  gap: 7px;
}

.password input {
  flex: 1;
  min-width: 0;
}

.show {
  background: #29374c;
  color: white;
  border: none;
  padding: 0 12px;
  border-radius: 8px;
  cursor: pointer;
}

.submit {
  width: 100%;
  margin-top: 24px;
  padding: 15px;
  background: #19bd8d;
  color: #071b17;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.submit:hover {
  background: #22d6a0;
}

.submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  background: #29374c;
  color: #b8f5dd;
  border-radius: 8px;
  line-height: 1.7;
}

.message.error {
  background: #47232c;
  color: #ffb8c6;
}

footer {
  text-align: center;
  padding: 20px;
  color: #8795aa;
  font-size: 12px;
}

[hidden] {
  display: none !important;
}

@media(max-width:480px) {
  .card {
    padding: 22px;
  }
  header {
    padding: 10px 4%;
  }
  .logo {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="assets/eqooption-logo.jpg" alt="EQOoption Logo">
    <div>EQ<span>Ooption</span></div>
  </div>

  <button class="lang" onclick="toggleLanguage()">
    العربية / English
  </button>
</header>

<main>
<section class="card">

<h1 id="heading">مرحباً بعودتك</h1>

<p class="subtitle">
سجل الدخول إلى حسابك في EQOoption
<br>
Welcome back to EQOoption
</p>

<div class="tabs">
  <button class="tab active" id="loginTab"
  onclick="showForm('login')">
    تسجيل الدخول
  </button>

  <button class="tab" id="registerTab"
  onclick="showForm('register')">
    إنشاء حساب
  </button>
</div>

<form id="loginForm" onsubmit="handleLogin(event)">

<label>البريد الإلكتروني / Email</label>
<input id="loginEmail" type="email" required
placeholder="example@email.com">

<label>كلمة المرور / Password</label>

<div class="password">
<input id="loginPassword" type="password"
required minlength="6" placeholder="كلمة المرور">

<button class="show" type="button"
onclick="togglePassword('loginPassword',this)">
إظهار
</button>
</div>
      <button class="submit" type="submit">
تسجيل الدخول / Sign In
</button>

</form>

<form id="registerForm" hidden
onsubmit="handleRegister(event)">

<label>الاسم الكامل / Full Name</label>
<input id="registerName" type="text" required placeholder="اسمك الكامل">

<label>البريد الإلكتروني / Email</label>
<input id="registerEmail" type="email" required placeholder="example@email.com">

<label>كلمة المرور / Password</label>

<div class="password">
<input id="registerPassword" type="password"
required minlength="6" placeholder="كلمة المرور">

<button class="show" type="button"
onclick="togglePassword('registerPassword',this)">
إظهار
</button>
</div>

<button class="submit" type="submit">
إنشاء حساب / Create Account
</button>

</form>

<div class="message" id="message"></div>

<p class="subtitle" style="margin-top:22px">
EQOoption
<br>
Terms & Privacy Policy
</p>

</section>
</main>

<footer>
EQOoption © 2026 | جميع الحقوق محفوظة
</footer>

<script>
// ضع هنا رابط مشروع Supabase والمفتاح العام (Anon / Publishable Key)
const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let english = false;

function showMessage(text, isError = false) {
  const message = document.getElementById('message');
  message.style.display = 'block';
  message.classList.toggle('error', isError);
  message.textContent = text;
}

function showForm(type) {
  const login = type === 'login';

  document.getElementById('loginForm').hidden = !login;
  document.getElementById('registerForm').hidden = login;

  document.getElementById('loginTab')
    .classList.toggle('active', login);

  document.getElementById('registerTab')
    .classList.toggle('active', !login);

  document.getElementById('heading').textContent =
    login
    ? (english ? 'Welcome Back' : 'مرحباً بعودتك')
    : (english ? 'Create Account' : 'إنشاء حساب جديد');

  document.getElementById('message').style.display = 'none';
}

function togglePassword(id, button) {
  const field = document.getElementById(id);
  const visible = field.type === 'password';

  field.type = visible ? 'text' : 'password';
  button.textContent = visible
    ? (english ? 'Hide' : 'إخفاء')
    : (english ? 'Show' : 'إظهار');
}

function toggleLanguage() {
  english = !english;

  document.documentElement.lang = english ? 'en' : 'ar';
  document.documentElement.dir = english ? 'ltr' : 'rtl';

  document.querySelector('.lang').textContent =
    english ? 'Arabic / English' : 'العربية / English';

  document.getElementById('loginTab').textContent =
    english ? 'Sign In' : 'تسجيل الدخول';

  document.getElementById('registerTab').textContent =
    english ? 'Register' : 'إنشاء حساب';

  showForm('login');
}

async function handleLogin(event) {
  event.preventDefault();
  const btn = event.target.querySelector('button[type="submit"]');
  btn.disabled = true;

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  btn.disabled = false;

  if (error) {
    showMessage(
      english ? Login failed: ${error.message} : فشل تسجيل الدخول: ${error.message},
      true
    );
    return;
  }

  showMessage(
    english ? 'Signed in successfully! Redirecting...' : 'تم تسجيل الدخول بنجاح! جاري التحويل...'
  );

  // غيّر 'index.html' إلى اسم صفحة المنصة أو لوحة التحكم بعد الدخول
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 1000);
}

async function handleRegister(event) {
  event.preventDefault();
  const btn = event.target.querySelector('button[type="submit"]');
  btn.disabled = true;

  const fullName = document.getElementById('registerName').value.trim();
  const email = document.getElementById('registerEmail').value.trim();
  const password = document.getElementById('registerPassword').value;

  const { data, error } = await supabaseClient.auth.signUp({
    email,password,
    options: {
      data: { full_name: fullName }
    }
  });

  btn.disabled = false;

  if (error) {
    showMessage(
      english ? Registration failed: ${error.message} : فشل إنشاء الحساب: ${error.message},
      true
    );
    return;
  }

  showMessage(
    english
      ? 'Account created! Please check your email if confirmation is enabled.'
      : 'تم إنشاء الحساب بنجاح! تفقد بريدك الإلكتروني إذا كان تأكيد البريد مفعلاً.'
  );
}
</script>

</body>
</html>
