<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EQOOption - تسجيل الدخول</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#111216;
  color:#f5f6fa;
  font-family:Arial,Tahoma,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 14px;
}
.container{width:100%;max-width:560px}
.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  color:#fff;
  margin:0 0 22px;
  letter-spacing:1px;
}
.logo span{color:#2678ff}
.notice{
  background:#101a2b;
  border:1px solid #0755a9;
  border-radius:14px;
  padding:18px;
  margin-bottom:22px;
  line-height:1.8;
}
.notice strong{color:#3284ff;font-size:19px}
.notice p{margin:5px 0 0;color:#c5ccda}
.card{
  background:#424b60;
  border-radius:18px;
  padding:26px 24px;
  box-shadow:0 12px 35px #0005;
}
.tabs{
  display:flex;
  background:#596174;
  border-radius:12px;
  padding:7px;
  margin-bottom:28px;
}
.tabs button{
  width:50%;
  border:0;
  background:transparent;
  color:#b8c2d2;
  padding:17px 8px;
  font-size:20px;
  font-weight:bold;
  border-radius:9px;
  cursor:pointer;
}
.tabs button.active{
  background:#30394e;
  color:#fff;
  border-bottom:4px solid #0875ff;
}
.form{display:none}
.form.active{display:block}
.field{margin:25px 0;position:relative}
.field label{
  display:block;
  color:#e0e6f0;
  font-size:17px;
  font-weight:bold;
  margin:0 0 9px;
}
.field input,.field select{
  width:100%;
  min-height:58px;
  border:2px solid #343a49;
  border-radius:13px;
  background:#20232d;
  color:#fff;
  padding:14px;
  font-size:17px;
  outline:none;
}
.field input:focus,.field select:focus{border-color:#2678ff}
.phone-row{display:flex;gap:10px}
.phone-row select{width:43%}
.phone-row input{width:57%;min-width:0}
.check-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin:20px 0;
  line-height:1.7;
  font-size:15px;
}
.check-row input{
  width:22px;height:22px;flex-shrink:0;margin-top:3px;
  accent-color:#0875ff;
}
.check-row a{color:#4592ff}
.submit{
  width:100%;
  border:0;
  border-radius:14px;
  background:linear-gradient(100deg,#287bff,#0062f5);
  color:white;
  font-size:21px;
  font-weight:bold;
  padding:20px;
  margin-top:18px;
  cursor:pointer;
}
.submit:disabled{opacity:.6;cursor:wait}
.message{
  display:none;
  padding:13px;
  border-radius:10px;
  margin:15px 0;
  line-height:1.6;
  background:#172b42;
  color:#dceaff;
}
.message.show{display:block}
.footer{
  text-align:center;
  color:#9da9bd;
  font-size:13px;
  margin-top:22px;
}
@media(max-width:420px){
  .card{padding:22px 16px}
  .tabs button{font-size:17px}
  .logo{font-size:27px}
}
</style>
</head>
<body>
<div class="container">

  <div class="logo">EQO<span>Option</span></div>

  <div class="notice">
    <strong>دخول آمن · EQOOption</strong>
    <p>سجّل الدخول أو أنشئ حسابك للوصول إلى منصتك.</p>
  </div>

  <main class="card">
    <div class="tabs">
      <button type="button" id="registerTab" class="active"
        onclick="showForm('register')">التسجيل</button>
      <button type="button" id="loginTab"
        onclick="showForm('login')">تسجيل الدخول</button>
    </div>

    <div id="message" class="message"></div>

    <!-- نموذج التسجيل -->
    <form id="registerForm" class="form active">

      <div class="field">
        <label for="regCountry">بلد الإقامة</label>
        <select id="regCountry" required>
          <option value="+967">اليمن (+967)</option>
          <option value="+966">السعودية (+966)</option>
          <option value="+971">الإمارات (+971)</option>
          <option value="+20">مصر (+20)</option>
          <option value="+962">الأردن (+962)</option>
          <option value="+965">الكويت (+965)</option>
          <option value="+974">قطر (+974)</option>
          <option value="+968">عُمان (+968)</option>
          <option value="+973">البحرين (+973)</option>
          <option value="+1">الولايات المتحدة (+1)</option>
          <option value="+44">المملكة المتحدة (+44)</option>
        </select>
      </div>

      <div class="field">
        <label>رقم الهاتف</label>
        <div class="phone-row">
          <select id="regCode" aria-label="رمز الدولة">
            <option value="+967">+967</option>
            <option value="+966">+966</option>
            <option value="+971">+971</option>
            <option value="+20">+20</option>
            <option value="+962">+962</option>
            <option value="+965">+965</option>
            <option value="+974">+974</option>
            <option value="+968">+968</option>
            <option value="+973">+973</option>
            <option value="+1">+1</option>
            <option value="+44">+44</option>
          </select>
          <input id="regPhone" type="tel" inputmode="tel"
            placeholder="رقم الهاتف" required>
        </div>
      </div>

      <div class="field">
        <label for="regEmail">البريد الإلكتروني</label>
        <input id="regEmail" type="email"
          placeholder="أدخل بريدك الإلكتروني" required>
      </div>

      <div class="field">
        <label for="regReferral">رمز الإحالة (اختياري)</label>
        <input id="regReferral" type="text"
          placeholder="أدخل رمز الإحالة">
      </div>

      <div class="field">
        <label for="regPassword">كلمة المرور</label>
        <input id="regPassword" type="password"
          placeholder="أنشئ كلمة مرور" minlength="8" required>
      </div>

      <div class="check-row">
        <input id="ageAgree" type="checkbox" required>
        <label for="ageAgree">أؤكد أن عمري 18 عاماً أو أكثر وأوافق على شروط المنصة.</label>
      </div>

      <button class="submit" type="submit">إنشاء الحساب</button>
    </form>
