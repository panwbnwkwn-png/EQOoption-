<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101411"><title>EQOOption | إنشاء حساب وتسجيل الدخول</title>

<style>
:root{--bg:#0b100d;--panel:#171f19;--panel2:#202b22;--green:#35e879;--muted:#a8b7ac;--line:#344438}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1b3323,#0b100d 60%);color:#f4fff6;font-family:Arial,Tahoma,sans-serif;display:grid;place-items:center;padding:22px}
.wrap{width:min(100%,510px)}.brand{text-align:center;margin-bottom:20px}.brand img{width:112px;height:112px;object-fit:cover;border-radius:50%;border:2px solid var(--green);box-shadow:0 0 24px #35e87933}.brand h1{font-size:27px;margin:10px 0 4px}.brand h1 span{color:var(--green)}.brand p{color:var(--muted);margin:0}
.card{background:#151d17;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 20px 70px #0008}.tabs{display:flex;background:#0d140f;padding:5px;border-radius:13px;margin-bottom:22px}.tabs button{flex:1;padding:13px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:16px;font-weight:bold;cursor:pointer}.tabs button.active{background:#24372a;color:#fff;box-shadow:inset 0 -3px var(--green)}
form{display:none}form.active{display:block}.field{margin:15px 0}.field label{display:block;margin-bottom:8px;font-weight:bold;font-size:14px}.field input,.field select{width:100%;height:51px;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:#0d140f;color:white;font-size:15px;outline:none}.field input:focus,.field select:focus{border-color:var(--green)}.phone-country{width:100%;height:51px;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:#0d140f;color:white;font-size:15px;outline:none}.phone-country:focus{border-color:var(--green)}.submit{width:100%;border:0;border-radius:12px;background:linear-gradient(100deg,#36ed7c,#18a94e);color:#07110a;font-weight:800;font-size:17px;padding:15px;margin-top:12px;cursor:pointer}.submit:disabled{opacity:.55}.row{display:flex;align-items:center;gap:9px;margin:14px 0;color:var(--muted);font-size:13px}.row input{accent-color:var(--green)}.message{display:none;padding:12px;border-radius:10px;background:#183522;color:#d7ffe2;line-height:1.7;margin:12px 0;overflow-wrap:anywhere}.message.show{display:block}.message.error{background:#442326;color:#ffe1e1}.forgot{display:block;background:none;border:0;color:var(--green);cursor:pointer;margin:8px 0}.foot{text-align:center;color:#819287;font-size:12px;margin:18px}
.terms-link{background:none;border:0;color:var(--green);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.terms-link:disabled{opacity:.5;cursor:not-allowed}
.terms-meta{color:var(--muted);font-size:12px;margin:0 28px 12px 0}
#termsDialog{width:min(900px,calc(100% - 28px));max-height:85vh;border:1px solid var(--line);border-radius:18px;padding:0;background:#151d17;color:#f4fff6;box-shadow:0 25px 80px #000a}
#termsDialog::backdrop{background:#000b;backdrop-filter:blur(3px)}
.terms-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.terms-dialog-head h2{font-size:18px;margin:0}
.terms-close{border:1px solid var(--line);border-radius:9px;background:#202b22;color:#fff;padding:8px 13px;cursor:pointer}
#termsContent{padding:18px 22px;max-height:65vh;overflow:auto;white-space:pre-wrap;line-height:1.9;direction:rtl;overflow-wrap:anywhere}
</style></head>
