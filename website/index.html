<script>
let balance = 10000;

function calculate(direction) {
  const entry = Number(document.getElementById('entry').value);
  const closing = Number(document.getElementById('closing').value);
  const amount = Number(document.getElementById('amount').value);
  const payout = Number(document.getElementById('payout').value);
  const result = document.getElementById('result');

  if (!entry  !closing  amount <= 0 ||
      !Number.isFinite(amount) ||
      payout < 0  payout > 100 
      amount > balance) {
    result.textContent = 'يرجى إدخال قيم صحيحة ضمن حدود الرصيد التجريبي.';
    return;
  }

  if (entry === closing) {
    result.textContent = 'يجب أن يختلف سعر الإغلاق عن سعر الدخول.';
    return;
  }

  const won = direction === 'up'
    ? closing > entry
    : closing < entry;

  const profit = amount * payout / 100;

  if (won) {
    balance += profit;
    result.innerHTML =
      'النتيجة الافتراضية: نجاح ✓<br>' +
      'الربح الافتراضي: $' + profit.toFixed(2);
  } else {
    balance -= amount;
    result.innerHTML =
      'النتيجة الافتراضية: خسارة<br>' +
      'الخسارة الافتراضية: $' + amount.toFixed(2);
  }

  document.getElementById('balance').textContent =
    '$' + balance.toLocaleString('en-US', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });}
</script>
</body>
</html>
