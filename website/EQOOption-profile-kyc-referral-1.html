<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EQOOption — التداول</title>
<style>
:root{--bg:#0b111b;--p:#121c2a;--p2:#172334;--line:#26364a;--muted:#91a2b7;--txt:#edf4fb;--g:#19bd8d;--g2:#20d6a0;--r:#f05268}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}
.top{height:64px;background:#0e1724;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:bold}.logo{width:46px;height:46px;display:flex;align-items:center;justify-content:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,255,100,.2))}.balance{background:#142b2b;border:1px solid #236653;padding:9px 13px;border-radius:9px;color:#bff8e4;font-size:13px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:12px;padding:12px;max-width:1600px;margin:auto}.panel{background:var(--p);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:14px;border-bottom:1px solid var(--line);font-weight:bold;display:flex;justify-content:space-between}.assets{padding:10px}.asset{width:100%;display:flex;justify-content:space-between;text-align:right;padding:12px 9px;border-radius:8px;background:transparent;color:var(--txt);border:1px solid transparent}.asset.active,.asset:hover{background:#1a2c3b;border-color:#2b5b52}.asset small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.change{color:var(--g2);font-size:12px;direction:ltr}.search,.control{width:calc(100% - 24px);margin:12px;background:#0c1521;border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--txt)}
.center{display:flex;flex-direction:column;gap:12px;min-width:0}.market{padding:13px 16px;display:flex;justify-content:space-between}.price{color:var(--g2);font-size:19px;font-weight:bold;direction:ltr}.muted{font-size:11px;color:var(--muted);margin-top:5px}.chart{height:470px;background:#0b111b}.chart iframe{width:100%;height:100%;border:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:13px}.stat span{font-size:11px;color:var(--muted)}.stat b{display:block;margin-top:7px}
.ticketbody{padding:13px}.label{display:block;font-size:12px;color:var(--muted);margin:5px 0}.ticketbody .control{width:100%;margin:0 0 13px}.quick{display:flex;gap:6px;margin:-6px 0 13px}.quick button{flex:1;background:#1c2b3c;color:#c5d2df;border-radius:7px;padding:7px;font-size:11px}.payout{padding:12px;background:#142c2a;border:1px solid #246b57;border-radius:9px;display:flex;justify-content:space-between;margin:3px 0 12px}.payout b{color:var(--g2);font-size:19px}.trade{width:100%;padding:14px;border-radius:9px;color:white;font-weight:bold;margin:5px 0}.up{background:linear-gradient(110deg,#119b70,#20c997)}.down{background:linear-gradient(110deg,#d9445d,#f05a6e)}.hint{font-size:10px;color:var(--muted);line-height:1.7;margin-top:9px}
.history{grid-column:1/-1}.history table{width:100%;border-collapse:collapse;font-size:12px}.history th,.history td{padding:12px;text-align:right;border-bottom:1px solid var(--line)}.history th{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:18px}.notice{position:fixed;bottom:15px;left:15px;background:#172c2a;border:1px solid #277d67;padding:12px 16px;border-radius:9px;display:none}
@media(max-width:1000px){.shell{grid-template-columns:190px minmax(0,1fr)}.ticket{grid-column:1/-1}}@media(max-width:680px){.top{height:57px;padding:0 10px}.brand{font-size:17px}.logo{width:36px;height:36px}.shell{display:flex;flex-direction:column;padding:8px}.chart{height:320px}.assets{display:grid;grid-template-columns:1fr 1fr}.asset{padding:9px 6px}.stats{gap:6px}.stat{padding:9px}.history{overflow:auto}.history table{min-width:500px}}

.eqo-nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#101b23;border-bottom:1px solid #263648;position:sticky;top:0;z-index:20}
.eqo-nav-btn{background:#172733;color:#c8d7df;border:1px solid #304653;border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:700}
.eqo-nav-btn.active{background:#155c4a;border-color:#22a77c;color:#fff}
.wallet-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 18px}
.wallet-card{background:linear-gradient(145deg,#172a35,#10201f);border:1px solid #2b4b4d;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.wallet-card span{color:#b8c8ce;font-size:13px}.wallet-card strong{font-size:25px;color:#e8f5ef}.wallet-card small{color:#8ea5a9;font-size:11px}
.eqo-placeholder{margin:18px;padding:24px;min-height:180px}.eqo-placeholder p{color:var(--muted);line-height:1.8}
@media(max-width:680px){.eqo-nav{padding:8px;gap:6px}.eqo-nav-btn{padding:9px 11px;font-size:12px;flex:1}.wallet-overview{grid-template-columns:1fr;margin:10px}.wallet-card{padding:12px}.wallet-card strong{font-size:22px}}

.account-switch-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.account-switch-label{font-size:11px;color:#9eb2c4;white-space:nowrap}
.account-switch{display:flex;gap:4px;padding:4px;border-radius:14px;background:#09131f;border:1px solid #2b4055;box-shadow:inset 0 1px 5px #0006}
.account-mode-btn{min-width:126px;display:grid;grid-template-columns:9px 1fr auto;align-items:center;gap:7px;padding:8px 11px;border-radius:10px;background:transparent;color:#9fb1c3;border:1px solid transparent;font-size:12px;text-align:right;transition:.2s}
.account-mode-btn b{font-size:12px;direction:ltr;color:#dce8f2}
.account-mode-btn .mode-dot{width:8px;height:8px;border-radius:50%;background:#64748b}
.account-mode-btn.active{background:linear-gradient(135deg,#0b795f,#16a47e);border-color:#35c49b;color:#fff;box-shadow:0 4px 15px #0da77b35}
.account-mode-btn.active .mode-dot{background:#a7f3d0;box-shadow:0 0 9px #a7f3d0}
.account-mode-btn.active b{color:#fff}
.account-wallet-link{font-size:11px;color:#9fb1c3;padding:8px 11px;border-right:1px solid #2b4055;white-space:nowrap}
.account-wallet-link b{color:#eaf4fb;direction:ltr;display:inline-block;margin-right:4px}
@media(max-width:700px){.top{height:auto;min-height:60px;gap:8px;flex-wrap:wrap;padding:8px 10px}.top .balance{width:100%;justify-content:space-between}.account-switch-wrap{width:100%;justify-content:space-between;gap:6px}.account-switch{flex:1}.account-mode-btn{min-width:0;flex:1;padding:8px 6px;grid-template-columns:7px 1fr;gap:5px}.account-mode-btn b{grid-column:2;font-size:11px}.account-switch-label{display:none}.account-wallet-link{border-right:0;padding:6px 2px}}


.request-panel{max-width:950px;margin:18px auto;padding:20px;border:1px solid #293d51;border-radius:16px;background:#111e2d}
.request-panel h3{margin:0 0 12px}.request-table-wrap{overflow-x:auto} .request-table{width:100%;border-collapse:collapse;min-width:520px;font-size:13px}.request-table th,.request-table td{padding:11px 9px;border-bottom:1px solid #293d51;text-align:right;white-space:nowrap}.request-table th{color:#9eb4c9}.status-pending{color:#e9bd65}.status-approved{color:#54d6a0}.status-rejected{color:#ff8585}

.deposit-panel{max-width:950px;margin:0 auto;padding:22px;border:1px solid #293d51;border-radius:18px;background:linear-gradient(145deg,#152437,#101b29)}
.deposit-panel h2{margin:0 0 10px}.deposit-panel h3{font-size:15px;margin:20px 0 10px}.deposit-note{color:#a9bdc8;font-size:12px;line-height:1.9;margin:10px 0 15px}.deposit-addresses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.deposit-address{min-width:0;background:#0d1927;border:1px solid #2b4055;border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:10px}.deposit-address code{direction:ltr;text-align:left;overflow-wrap:anywhere;color:#e8f5ef;font-size:11px}.copy-address{background:#174b43;color:#eafff8;border:1px solid #2b806c;border-radius:8px;padding:9px}.deposit-panel .control{width:100%;margin:0 0 12px;background:#0b1522;color:#edf4fb;border:1px solid #2b4055;border-radius:9px;padding:12px}.deposit-preview{display:block;max-width:260px;max-height:260px;object-fit:contain;border:1px solid #2b4055;border-radius:10px;margin:12px 0}.deposit-warning{color:#e8bd75;font-size:11px;line-height:1.8;margin-top:15px}
@media(max-width:760px){.deposit-addresses{grid-template-columns:1fr}.deposit-panel{padding:15px}}

.menu-trigger{order:-1;background:#172733;color:#eaf4fb;border:1px solid #304653;border-radius:10px;width:42px;height:42px;font-size:22px;display:flex;align-items:center;justify-content:center}
.side-overlay{position:fixed;inset:0;background:#0009;z-index:80;display:none}
.side-overlay.open{display:block}
.side-drawer{position:fixed;z-index:81;top:0;left:0;height:100dvh;width:min(310px,86vw);background:#101b29;border-right:1px solid #2b4055;box-shadow:12px 0 35px #0008;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;padding:18px}
.side-drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #293d51}
.drawer-close{background:#24364a;color:#fff;border-radius:8px;padding:8px 12px;font-size:18px}
.drawer-link{width:100%;display:flex;align-items:center;gap:12px;text-align:right;background:transparent;color:#dce8f2;border:1px solid transparent;border-radius:10px;padding:12px;margin:4px 0;font-weight:700}
.drawer-link:hover,.drawer-link.active{background:#174b43;border-color:#2b806c;color:#fff}
.drawer-icon{width:25px;text-align:center;color:#40d6ad;font-size:18px}
.drawer-support{display:block;text-decoration:none;text-align:center;background:#123e62;color:#e8f5ff;border:1px solid #2876a8;border-radius:10px;padding:12px;margin-top:8px;font-weight:bold}
.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.profile-item{background:#0d1927;border:1px solid #2b4055;border-radius:10px;padding:14px;min-width:0}
.profile-item small{display:block;color:#91a2b7;margin-bottom:7px}
.profile-item strong{overflow-wrap:anywhere}
.settings-action{background:#174b43;color:#eafff8;border:1px solid #2b806c;border-radius:9px;padding:12px;margin:6px 4px 6px 0}
@media(max-width:680px){.menu-trigger{width:38px;height:38px}.profile-grid{grid-template-columns:1fr}}

</style></head>
